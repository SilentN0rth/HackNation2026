tytuly:
  - "^(wniosek|deklaracja|zgłoszenie|oświadczenie|podanie|informacja|zawiadomienie|formularz)\\b"

pola:
  - wzorzec: "pesel"
    walidacja: [PESEL]
  - wzorzec: "\\bnip\\b"
    walidacja: [NIP]
  - wzorzec: "\\bregon\\b"
    walidacja: [REGON]
  - wzorzec: "kod pocztowy"
    walidacja: [ZIP_CODE]
  - wzorzec: "e-?mail|poczty elektronicznej"
    walidacja: [EMAIL]
  - wzorzec: "seria i numer dowodu|numer dowodu osobistego"
    walidacja: [SERIAL_NUMBER_ID_CARD]
  - wzorzec: "epuap"
    walidacja: [EPUAP]
  - wzorzec: "adres do e-doręczeń|\\bade\\b"
    walidacja: [ADE]
  - wzorzec: "^kraj\\b"
    typ: SELECT
    slownik: Kraje
  - wzorzec: "rasa|rasy psa|rasie"
    typ: SELECT
    slownik: RASY_PSOW_UZNAWANYCH_ZA_AGRESYWNE
  - wzorzec: "dyscyplin"
    typ: SELECT
    slownik: DYSCYPLINY_SPORTOWE
  - wzorzec: "^data\\b|\\bdata (urodzenia|uiszczenia|zapłaty|rozpoczęcia|zakończenia)|od dnia|do dnia|\\btermin\\b"
    typ: DATEPICKER
  - wzorzec: "kwot|wysokość (opłaty|nadpłaty|podatku)|\\bliczba\\b|\\bilość\\b|powierzchni|\\bzł\\b|m²|\\bmetr|wiek\\b"
    typ: NUMBER
  - wzorzec: "numer (rachunku|konta)|rachunek bankowy"
    typ: TEXT_FIELD
    podpowiedz: "Wpisz 26 cyfr numeru rachunku."
  - wzorzec: "uzasadnieni|^opis|uwagi|przyczyn|^cel\\b|okoliczności|charakterystyk|osiągnię"
    typ: TEXTAREA

dane_standardowe:
  - "imi[ęe]|nazwisk"
  - "nazwa (firmy|podmiotu|wnioskodawcy)"
  - "adres (zamieszkania|siedziby|do korespondencji)|^adres\\b|siedziba"
  - "\\bpesel\\b|\\bnip\\b|\\bregon\\b"
  - "telefon|e-?mail|poczty elektronicznej"
  - "^(miejscowość|ulica|numer domu|numer lokalu|kod pocztowy|nr domu|nr lokalu)$"

wrazliwe:
  - "seria i numer dowodu|numer dowodu"
  - "nazwisko rodowe"
  - "imi[ęe] (ojca|matki)"
  - "stan cywilny"
  - "\\bpłeć\\b"
  - "miejsce urodzenia"
  - "obywatelstwo|narodowość"
  - "wykształcenie"
  - "wyznanie|religi"
  - "stan zdrowia|niepełnosprawn"

przeformulowania:
  - wzorzec: "kwotę nadpłaty proszę"
    tytul: "Wybierz, co mamy zrobić z nadpłatą"
  - wzorzec: "proszę o wydanie zaświadczenia"
    tytul: "Czego ma dotyczyć zaświadczenie?"
  - wzorzec: "celem przedłożenia|cel wydania"
    tytul: "W jakim celu potrzebujesz zaświadczenia?"
  - wzorzec: "^nazwa organu, w którym zapłacono"
    tytul: "Nazwa urzędu, w którym zapłacono opłatę"
  - wzorzec: "^dane właściciela$"
    tytul: "Imię i nazwisko właściciela rachunku"
  - wzorzec: "^inne$"
    tytul: "Inne"

luki_w_tekscie:
  - fraza: "w miejscowości"
    tytul: "Miejscowość"
  - fraza: "przy ulicy"
    tytul: "Ulica"
  - fraza: "(numer|nr) ewidencyjny działki|nr działki|działki nr"
    tytul: "Numer ewidencyjny działki"
  - fraza: "w obrębie|obręb"
    tytul: "Obręb"
  - fraza: "w kwocie|w wysokości"
    tytul: "Kwota"
    typ: NUMBER
  - fraza: "na okres|w okresie"
    tytul: "Okres"
  - fraza: "w dniu|w dniach"
    tytul: "Data"
    typ: DATEPICKER

dopytania:
