name: e-formularze

services:
  api:
    build: ./apps/api
    image: e-formularze-api:1.0.0
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_PAGES: ${MAX_PAGES:-40}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      JWT_TTL_MIN: ${JWT_TTL_MIN:-480}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EDENAI_API_KEY: ${EDENAI_API_KEY:-}
      EDENAI_MODEL: ${EDENAI_MODEL:-mistral/mistral-small-2603}
    secrets:
      - jwt_secret
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - api-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCKS: "false"
    image: e-formularze-web:1.0.0
    ports:
      - "5173:8080"
    environment:
      # Hooki Payloada wołają silnik AI w sieci compose (nie przez localhost przeglądarki)
      FASTAPI_URL: http://api:8000
      # Konto i dane demo przy starcie (idempotentnie); PAYLOAD_SEED=false na czystą instalację
      PAYLOAD_SEED: ${PAYLOAD_SEED:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-demo1234}
    secrets:
      - payload_secret
    volumes:
      - web-data:/app/data
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.17
    profiles:
      - llm
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  payload_secret:
    file: ./secrets/payload_secret.txt

volumes:
  api-data:
  web-data:
  ollama-models:
