pomijane_linie:
  - "^strona \\d+\\s*(/|z)\\s*\\d+$"
  - "^\\d+\\s*/\\s*\\d+$"
  - "^(czytelny )?podpis"
  - "podpis wnioskodawcy|podpis składającego|podpis osoby"
  - "^(data i podpis|miejscowość i data|data, podpis)"
  - "^data:?$"
  - "^\\)"
  - "^\\(?data\\)?:?$"
  - "^\\(?(miejscowość i data|data i podpis|miejscowość, data)"
  - "^dnia:?$"
  - "załącznik (nr|numer) \\d+ do"
  - "strona \\d+ z \\d+"
  - "^wersja .*\\d{4}"
  - "^(nr|numer) sprawy"
  - "niepotrzebne skreślić"
  - "(\\d[ -]?){20,}"
  - "^opłata skarbowa\\s*[–-]\\s*\\d+"
  - "dane nieobowiązkowe\\.?$"
  - "^(dd|rrrr)[-./ ]"
  - "^pieczęć"
  - "wypełnia (urząd|organ|pracownik)"
  - "wypełnij wielkimi literami|wypełniaj kolorem|pola wyboru oznaczaj"
  - "^(tak|nie)$"
  - "^\\W*$"
  - "^\\d{1,2}\\)?$"
  - "podpis"
  - ",\\s*dnia\\s*$"
  - "^\\d{2}-\\d{3}\\s"
  - "^(ul\\.|ulica)\\s"
  - "^wnioskodawca\\b"
  - "^\\*"
  - "^(do|adresat)$"

