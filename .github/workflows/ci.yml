name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_API_URL: http://localhost:8000

  api:
    name: api (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv venv .venv && uv pip install -p .venv -r requirements.txt -r requirements-dev.txt
      - run: .venv/bin/ruff check app tests scripts
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python scripts/check_outputs.py

  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p secrets && openssl rand -base64 48 > secrets/jwt_secret.txt
      - run: docker compose build
